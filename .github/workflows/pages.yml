name: Déployer le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Contrôler et construire
        run: npm run qa

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Tester le site dans le navigateur
        run: |
          npm run serve &
          sleep 1
          npm run audit:runtime

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Envoyer le site construit
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v5
