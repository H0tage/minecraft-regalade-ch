<section class="train-shell">
  <nav
    class="train-switcher"
    role="tablist"
    aria-label="Choisir le parcours ferroviaire"
    data-tab-storage="regalade.trains.active"
  >
    <button
      id="train-overview-tab"
      type="button"
      role="tab"
      aria-selected="true"
      aria-controls="train-overview-panel"
      tabindex="0"
    >
      Des rails entre les villes
    </button>
    <button
      id="train-first-tab"
      type="button"
      role="tab"
      aria-selected="false"
      aria-controls="train-first-panel"
      tabindex="-1"
    >
      Mon premier train
    </button>
    <button
      id="train-automatic-tab"
      type="button"
      role="tab"
      aria-selected="false"
      aria-controls="train-automatic-panel"
      tabindex="-1"
    >
      Ma première ligne automatique
    </button>
    <button
      id="train-freight-tab"
      type="button"
      role="tab"
      aria-selected="false"
      aria-controls="train-freight-panel"
      tabindex="-1"
    >
      Transporter des marchandises
    </button>
  </nav>

  <!-- @include trains/overview.html -->
  <!-- @include trains/first-train.html -->
  <!-- @include trains/automatic-line.html -->
  <!-- @include trains/freight.html -->
</section>
