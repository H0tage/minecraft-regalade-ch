<section class="storage-shell">
  <nav
    class="storage-switcher"
    role="tablist"
    aria-label="Choisir le parcours de stockage"
    data-tab-storage="regalade.storage.active"
  >
    <button
      id="storage-overview-tab"
      type="button"
      role="tab"
      aria-selected="true"
      aria-controls="storage-overview-panel"
      tabindex="0"
    >
      Comprendre le stockage
    </button>
    <button
      id="storage-drawers-tab"
      type="button"
      role="tab"
      aria-selected="false"
      aria-controls="storage-drawers-panel"
      tabindex="-1"
    >
      Le mur de Drawers
    </button>
    <button
      id="storage-backpack-tab"
      type="button"
      role="tab"
      aria-selected="false"
      aria-controls="storage-backpack-panel"
      tabindex="-1"
    >
      Backpack : bonnes pratiques
    </button>
    <button
      id="storage-vault-tab"
      type="button"
      role="tab"
      aria-selected="false"
      aria-controls="storage-vault-panel"
      tabindex="-1"
    >
      Stock d’usine
    </button>
  </nav>

  <!-- @include storage/overview.html -->
  <!-- @include storage/drawers.html -->
  <!-- @include storage/backpack.html -->
  <!-- @include storage/vault.html -->
