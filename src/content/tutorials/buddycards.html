<section class="buddy-tutorial">
  <nav
    class="buddy-switcher"
    role="tablist"
    aria-label="Choisir le parcours Buddycards"
    data-tab-storage="regalade.buddycards.active"
  >
    <button
      id="buddy-overview-tab"
      type="button"
      role="tab"
      aria-selected="true"
      aria-controls="buddy-overview-panel"
      tabindex="0"
    >
      Comprendre la collection
    </button>
    <button
      id="buddy-find-tab"
      type="button"
      role="tab"
      aria-selected="false"
      aria-controls="buddy-find-panel"
      tabindex="-1"
    >
      Trouver ses premières cartes
    </button>
    <button
      id="buddy-organize-tab"
      type="button"
      role="tab"
      aria-selected="false"
      aria-controls="buddy-organize-panel"
      tabindex="-1"
    >
      Ranger et exposer
    </button>
    <button
      id="buddy-create-tab"
      type="button"
      role="tab"
      aria-selected="false"
      aria-controls="buddy-create-panel"
      tabindex="-1"
    >
      Recycler avec Create
    </button>
    <button
      id="buddy-delightful-tab"
      type="button"
      role="tab"
      aria-selected="false"
      aria-controls="buddy-delightful-panel"
      tabindex="-1"
    >
      Cultiver les Buddybeans
    </button>
    <button
      id="buddy-completion-tab"
      type="button"
      role="tab"
      aria-selected="false"
      aria-controls="buddy-completion-panel"
      tabindex="-1"
    >
      Compléter ses collections
    </button>
  </nav>

  <!-- @include buddycards/delightful.html -->
  <!-- @include buddycards/completion.html -->
</section>
