<section class="qol-tutorial">
  <nav
    class="qol-switcher"
    role="tablist"
    aria-label="Choisir le parcours Confort et réglages"
    data-tab-storage="regalade.qol.active"
  >
    <button
      id="qol-overview-tab"
      type="button"
      role="tab"
      aria-selected="true"
      aria-controls="qol-overview-panel"
      tabindex="0"
    >
      Présentation générale
    </button>
    <button
      id="qol-inventory-tab"
      type="button"
      role="tab"
      aria-selected="false"
      aria-controls="qol-inventory-panel"
      tabindex="-1"
    >
      Inventaire et fabrication
    </button>
    <button
      id="qol-information-tab"
      type="button"
      role="tab"
      aria-selected="false"
      aria-controls="qol-information-panel"
      tabindex="-1"
    >
      Informations à l’écran
    </button>
    <button
      id="qol-sound-tab"
      type="button"
      role="tab"
      aria-selected="false"
      aria-controls="qol-sound-panel"
      tabindex="-1"
    >
      Son et communication
    </button>
    <button
      id="qol-settings-tab"
      type="button"
      role="tab"
      aria-selected="false"
      aria-controls="qol-settings-panel"
      tabindex="-1"
    >
      Réglages et raccourcis
    </button>
    <button
      id="qol-automatic-tab"
      type="button"
      role="tab"
      aria-selected="false"
      aria-controls="qol-automatic-panel"
      tabindex="-1"
    >
      Améliorations automatiques
    </button>
  </nav>
