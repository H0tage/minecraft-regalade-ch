<section id="mods" class="view">
  <div class="page-head">
    <span class="eyebrow">Le pack</span>
    <h1 id="mods-title">Les mods principaux du serveur</h1>
    <p>Recherche un mod par son nom, ou choisis une catégorie.</p>
  </div>
  <div class="mods-toolbar">
    <input
      id="mod-search"
      class="search"
      type="search"
      placeholder="Rechercher un mod…"
      aria-label="Rechercher un mod"
    />
  </div>
  <div id="mod-tabs" class="mod-tabs" aria-label="Catégories de mods"></div>
  <p id="mod-count" class="mod-count"></p>
  <div id="mods-grid" class="mods-grid"></div>
</section>
