<section id="tutoriels" class="view">
  <header class="tutorial-masthead">
    <div class="tutorial-masthead-cue tutorial-masthead-cue-left">
      <strong>Choix du tutoriel</strong><i aria-hidden="true">↓</i>
    </div>
    <div class="tutorial-masthead-cue tutorial-masthead-cue-content">
      <strong>Contenu du tuto</strong><i aria-hidden="true">↓</i>
    </div>
    <div class="tutorial-masthead-cue tutorial-masthead-cue-right">
      <strong>Navigation dans le tuto</strong><i aria-hidden="true">↓</i>
    </div>
  </header>

  <div class="tutorial-workspace">
    <aside class="tutorial-library" aria-label="Choisir un tutoriel">

        <button class="tutorial-library-toggle" type="button" aria-expanded="false"></button>

          class="tutorial-tabs"
          role="tablist"
          aria-label="Choisir un tutoriel"
          data-tab-storage="regalade.tutorial.active"
        >
          <p class="tutorial-library-group" role="presentation">Tutos ultra essentiels</p>
          <button
            class="tutorial-tab active"
            id="tutorial-first-minecraft-tab"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="tutorial-first-minecraft"
          >
            Première fois sur Minecraft ?
          </button>
          <button
            class="tutorial-tab"
            id="tutorial-jei-tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="tutorial-jei"
            tabindex="-1"
          >
            JEI
          </button>
          <p class="tutorial-library-group" role="presentation">Tous les autres</p>
          <button
            class="tutorial-tab"
            id="tutorial-exploration-tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="tutorial-exploration"

            id="tutorial-qol-tab"
            type="button"
            role="tab"
            aria-selected="false"

          <button
            class="tutorial-tab"
            id="tutorial-create-first-factory-tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="tutorial-create-first-factory"
            tabindex="-1"

            Industrie et Automatisation
          </button>
          <button
            class="tutorial-tab"
            id="tutorial-economy-tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="tutorial-economy"
            tabindex="-1"
          >
            Argent et échanges
          </button>
          <button
            class="tutorial-tab"
            id="tutorial-agriculture-tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="tutorial-agriculture"

            Agriculture
          </button>
          <button
            class="tutorial-tab"
            id="tutorial-cuisine-tab"
            type="button"
            role="tab"
            aria-selected="false"

          <button

            aria-selected="false"

            aria-selected="false"
            aria-controls="tutorial-trains"

            role="tab"
