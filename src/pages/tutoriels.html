<section id="tutoriels" class="view">
  <div class="tutorial-tabs" role="tablist" aria-label="Choisir un tutoriel">
    <button class="tutorial-tab active" id="tutorial-install-tab" type="button" role="tab" aria-selected="true" aria-controls="tutorial-install">Guide d’installation</button>
    <button class="tutorial-tab" id="tutorial-connection-tab" type="button" role="tab" aria-selected="false" aria-controls="tutorial-connection">Informations de connexion</button>
    <button class="tutorial-tab" id="tutorial-stargates-tab" type="button" role="tab" aria-selected="false" aria-controls="tutorial-stargates">Porte des étoiles</button>
  </div>

  <div class="tutorial-content">
    <div class="tutorial-panel active" id="tutorial-install" role="tabpanel" aria-labelledby="tutorial-install-tab"></div>
    <div class="tutorial-panel" id="tutorial-connection" role="tabpanel" aria-labelledby="tutorial-connection-tab" hidden></div>
    <div class="tutorial-panel" id="tutorial-stargates" role="tabpanel" aria-labelledby="tutorial-stargates-tab" hidden></div>
  </div>
</section>
