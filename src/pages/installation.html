<section id="installation" class="view">
  <div class="installation-page-head">
    <span class="eyebrow">Bien commencer</span>
    <h1>Installation et connexion</h1>
    <p>
      Installe le modpack Régalade, prépare Minecraft puis retrouve ici les informations nécessaires pour rejoindre le
      serveur.
    </p>
  </div>
  <div
    class="installation-page-tabs"
    role="tablist"
    aria-label="Installation et connexion"
    data-tab-storage="regalade.installation.active"
  >
    <button id="installation-guide-tab" type="button" role="tab" aria-selected="true" aria-controls="tutorial-install">
      Guide d’installation
    </button>
    <button
      id="installation-connection-tab"
      type="button"
      role="tab"
      aria-selected="false"
      aria-controls="tutorial-connection"
      tabindex="-1"
    >
      Informations de connexion
    </button>
  </div>
  <div class="installation-page-content">
    <section class="installation-panel" id="tutorial-install" role="tabpanel" aria-labelledby="installation-guide-tab">
      <!-- @include ../content/installation/guide.html -->
    </section>
    <section
      class="installation-panel"
      id="tutorial-connection"
      role="tabpanel"
      aria-labelledby="installation-connection-tab"
      hidden
    >
      <!-- @include ../content/installation/connection.html -->
    </section>
  </div>
</section>
